<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Stream</title>
  <script src="https://player.live-video.net/1.24.0/amazon-ivs-player.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

    header { padding: 14px 24px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 12px; }
    header a { color: #888; text-decoration: none; font-size: 13px; }
    header a:hover { color: #fff; }
    header h1 { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #live-badge { padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; background: #2a2a2a; color: #888; letter-spacing: 0.04em; flex-shrink: 0; }
    #live-badge.live { background: #e53935; color: #fff; }
    #live-badge.offline { background: #2a2a2a; color: #888; }

    .player-wrap { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; }
    #player-video { width: 100%; height: 100%; max-height: calc(100vh - 56px); object-fit: contain; display: block; }

    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
    .overlay svg { width: 56px; height: 56px; color: #444; }
    .overlay p { color: #666; font-size: 15px; }
    .overlay small { color: #444; font-size: 12px; }
    #overlay-offline { display: none; }
    #overlay-loading { display: none; }

    .spinner { width: 40px; height: 40px; border: 3px solid #2a2a2a; border-top-color: #e53935; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { padding: 10px 24px; background: #1a1a1a; border-top: 1px solid #2a2a2a; font-size: 11px; color: #444; display: flex; gap: 16px; }
    #viewer-count { color: #666; }
    #error-msg { color: #e57373; }
  </style>
</head>
<body>

<header>
  <a href="/">← Go Live</a>
  <h1 id="stream-title">Loading stream...</h1>
  <span id="live-badge">...</span>
</header>

<div class="player-wrap">
  <video id="player-video" controls playsinline autoplay></video>

  <div class="overlay" id="overlay-loading">
    <div class="spinner"></div>
    <p>Connecting to stream...</p>
  </div>

  <div class="overlay" id="overlay-offline">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
      <line x1="3" y1="3" x2="21" y2="21" stroke-width="1.5"/>
    </svg>
    <p>Stream is offline</p>
    <small>This page will refresh automatically when the stream starts.</small>
  </div>
</div>

<footer>
  <span id="viewer-count"></span>
  <span id="error-msg"></span>
</footer>

<script>
  const API = 'http://localhost:8000/api/v1';
  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session');
  const directUrl = params.get('url');

  let player = null;
  let pollTimer = null;
  let currentPlaybackUrl = null;
  let isPlaying = false;

  function showLoading() {
    document.getElementById('overlay-loading').style.display = 'flex';
    document.getElementById('overlay-offline').style.display = 'none';
  }

  function showOffline() {
    document.getElementById('overlay-loading').style.display = 'none';
    document.getElementById('overlay-offline').style.display = 'flex';
    document.getElementById('player-video').style.display = 'none';
  }

  function showPlayer() {
    document.getElementById('overlay-loading').style.display = 'none';
    document.getElementById('overlay-offline').style.display = 'none';
    document.getElementById('player-video').style.display = 'block';
  }

  function setBadge(state) {
    const el = document.getElementById('live-badge');
    if (state === 'live') { el.textContent = 'LIVE'; el.className = 'live'; }
    else if (state === 'offline') { el.textContent = 'OFFLINE'; el.className = 'offline'; }
    else { el.textContent = '...'; el.className = ''; }
  }

  function initPlayer(playbackUrl) {
    if (!window.IVSPlayer || !IVSPlayer.isPlayerSupported) {
      document.getElementById('error-msg').textContent = 'IVS Player not supported in this browser.';
      return;
    }

    if (player) {
      player.pause();
      player.delete();
      player = null;
    }

    player = IVSPlayer.create();
    player.attachHTMLVideoElement(document.getElementById('player-video'));

    player.addEventListener(IVSPlayer.PlayerState.PLAYING, () => {
      isPlaying = true;
      showPlayer();
      setBadge('live');
    });

    player.addEventListener(IVSPlayer.PlayerState.ENDED, () => {
      isPlaying = false;
      showOffline();
      setBadge('offline');
    });

    player.addEventListener(IVSPlayer.PlayerEventType.ERROR, (err) => {
      isPlaying = false;
      document.getElementById('error-msg').textContent = `Player error: ${err.message}`;
    });

    player.load(playbackUrl);
    player.play();
    currentPlaybackUrl = playbackUrl;
  }

  async function pollSession() {
    if (!sessionId) return;
    try {
      const res = await fetch(`${API}/streams/${sessionId}`);
      if (!res.ok) {
        showOffline();
        setBadge('offline');
        document.getElementById('stream-title').textContent = 'Stream not found';
        return;
      }
      const data = await res.json();

      document.getElementById('stream-title').textContent = data.title || 'Live Stream';
      if (data.viewer_count > 0) {
        document.getElementById('viewer-count').textContent = `${data.viewer_count} viewer${data.viewer_count !== 1 ? 's' : ''}`;
      }

      if (data.is_live && data.playback_url) {
        if (!isPlaying || currentPlaybackUrl !== data.playback_url) {
          showLoading();
          initPlayer(data.playback_url);
        }
        setBadge('live');
      } else {
        showOffline();
        setBadge('offline');
        isPlaying = false;
      }
    } catch (e) {
      document.getElementById('error-msg').textContent = `Poll error: ${e.message}`;
    }
  }

  async function init() {
    if (directUrl) {
      // Direct playback URL passed as ?url=...
      document.getElementById('stream-title').textContent = 'Live Stream';
      setBadge('live');
      showLoading();
      initPlayer(decodeURIComponent(directUrl));
      return;
    }

    if (!sessionId) {
      document.getElementById('stream-title').textContent = 'No stream specified';
      showOffline();
      setBadge('offline');
      return;
    }

    showLoading();
    await pollSession();
    pollTimer = setInterval(pollSession, 5000);
  }

  init();
  window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });
</script>
</body>
</html>
