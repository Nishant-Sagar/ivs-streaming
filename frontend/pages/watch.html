<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Live</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="https://player.live-video.net/1.26.0/amazon-ivs-player.min.js"></script>
</head>
<body>

<nav>
  <a class="nav-logo" href="/app/stream.html">⚡ StreamSpace</a>
</nav>

<div class="container page">
  <div class="watch-layout">
    <div>
      <div class="video-wrapper">
        <video id="video-player" playsinline autoplay muted></video>
        <div class="offline-overlay" id="offline-overlay">
          <div class="offline-icon">📡</div>
          <div class="offline-text">Stream is offline</div>
        </div>
      </div>
      <div class="stream-meta">
        <div class="streamer-avatar" id="streamer-avatar" style="background:var(--gradient)">📡</div>
        <div>
          <div class="flex items-center gap-2">
            <span class="streamer-name">Live Stream</span>
            <span class="badge-live" id="live-badge" style="display:none">LIVE</span>
          </div>
          <div class="streamer-desc text-muted text-sm" id="status-text">Connecting to stream...</div>
        </div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-header"><span>💬 Chat</span></div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-msg system">Chat is not available in this mode.</div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/static/js/player.js"></script>
<script>
  const playbackUrl = new URLSearchParams(location.search).get('playback');

  if (!playbackUrl) {
    document.getElementById('status-text').textContent = 'Missing ?playback= parameter.';
  } else {
    const mgr = new IVSPlayerManager(document.getElementById('video-player'));
    mgr.onStateChange = (state) => {
      const overlay = document.getElementById('offline-overlay');
      const badge   = document.getElementById('live-badge');
      const text    = document.getElementById('status-text');
      if (state === 'playing') {
        overlay.style.display = 'none';
        badge.style.display = '';
        text.textContent = 'Live now';
      } else if (state === 'buffering') {
        text.textContent = 'Buffering...';
      } else {
        overlay.style.display = 'flex';
        badge.style.display = 'none';
        text.textContent = 'Stream is offline or ended';
      }
    };
    mgr.init(playbackUrl).catch(e => {
      document.getElementById('status-text').textContent = 'Player error: ' + e.message;
    });
  }
</script>
</body>
</html>
